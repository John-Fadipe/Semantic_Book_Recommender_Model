<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Book Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Semantic Book Recommender</h1>

    <form method="POST" action="/recommend" class="form-container">
        <input type="text" name="query" placeholder="Describe a book..." value="{{ query or '' }}" required>
        
        <select name="category">
            <option value="All">All</option>
            {% for cat in book_model.categories %}
                <option value="{{ cat }}" {% if category==cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
        </select>

        <select name="tone">
            <option value="All">All</option>
            {% for t in book_model.tones %}
                <option value="{{ t }}" {% if tone==t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>

        <button type="submit">Find recommendations</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if results %}
    <h2>Recommendations</h2>
    <div class="gallery">
        {% for img, caption in results %}
        <div class="item">
            <img src="{{ img }}" alt="Book cover">
            <p>{{ caption }}</p>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</body>
</html>
